name: Build WorkSuitability100 v4.1

on:
  push:
    branches: [main]
    paths:
      - 'WorkSuitability100/**'
      - '.github/workflows/build-work-suitability.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXE: PalworldEXE/Palworld-Win64-Shipping.exe

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Acquire exact Palworld executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path PalworldEXE | Out-Null
          $url = 'https://github.com/Animuuufx/PalworldAbilityLvl100/releases/download/Palworld-Win64-Shipping.exe/Palworld-Win64-Shipping.exe'
          Invoke-WebRequest -Uri $url -OutFile $env:EXE -UseBasicParsing

      - name: Verify exact Palworld executable
        shell: pwsh
        run: |
          $f = Get-Item $env:EXE
          if ($f.Length -ne 161802312) { throw "Unexpected Palworld executable size: $($f.Length)" }
          $hash = (Get-FileHash $env:EXE -Algorithm SHA256).Hash.ToLower()
          Write-Host "EXE SHA256: $hash"
          if ($hash -ne '44b6295e70aa37b83d1c42ce1dcf865a7ffadcd300298b0e49a02bad8eb83443') {
            throw "Unexpected Palworld executable hash."
          }

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build native DLL
        shell: cmd
        run: |
          if not exist build mkdir build
          cl /nologo /LD /O2 /GS- /EHsc /GR- /std:c++17 WorkSuitability100\Native\WorkSuitability100_v2.cpp /Fe:build\WorkSuitability100.dll /link /MACHINE:X64
          if errorlevel 1 exit /b 1

      - name: Stage crash-safe package
        shell: pwsh
        run: |
          Copy-Item build/WorkSuitability100.dll WorkSuitability100/Native/WorkSuitability100.dll -Force
          $sha = (Get-FileHash WorkSuitability100/Native/WorkSuitability100.dll -Algorithm SHA256).Hash.ToLower()
          @(
            'WorkSuitability100 package v4.1'
            'Native DLL runtime: v2.5'
            "DLL SHA256: $sha"
            'Target EXE SHA256: 44b6295e70aa37b83d1c42ce1dcf865a7ffadcd300298b0e49a02bad8eb83443'
            'Target EXE size: 161802312'
            'Native speed hook RVA: 0x2F79D30'
            'Live rank getter RVA: 0x2F80390'
            'Lua container mutation: DISABLED'
            'Build: GitHub Actions / MSVC x64'
          ) | Set-Content WorkSuitability100/Native/BUILD_INFO.txt
          Compress-Archive -Path WorkSuitability100 -DestinationPath build/WorkSuitability100-v4.1.zip -Force

      - name: Upload packaged mod
        uses: actions/upload-artifact@v4
        with:
          name: WorkSuitability100-v4.1
          path: build/WorkSuitability100-v4.1.zip
