name: Build WorkSuitability100

on:
  push:
    branches: [main]
    paths:
      - 'WorkSuitability100/Native/WorkSuitability100_v1_7.cpp'
      - 'WorkSuitability100/Native/patch_v1_7_source.ps1'
      - '.github/workflows/build-work-suitability.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Apply source patch
        shell: pwsh
        run: |
          & .\WorkSuitability100\Native\patch_v1_7_source.ps1
          git diff -- WorkSuitability100/Native/WorkSuitability100_v1_7.cpp

      - name: Build DLL
        shell: cmd
        run: |
          if not exist build mkdir build
          cl /nologo /LD /O2 /GS- /EHsc- /GR- /std:c++17 WorkSuitability100\Native\WorkSuitability100_v1_7.cpp /Fe:build\WorkSuitability100.dll /link /MACHINE:X64
          if errorlevel 1 exit /b 1

      - name: Synchronize with main and stage DLL
        shell: pwsh
        run: |
          git fetch origin main
          git reset --hard origin/main
          & .\WorkSuitability100\Native\patch_v1_7_source.ps1
          Copy-Item build/WorkSuitability100.dll WorkSuitability100/Native/WorkSuitability100.dll -Force
          $sha = (Get-FileHash WorkSuitability100/Native/WorkSuitability100.dll -Algorithm SHA256).Hash.ToLower()
          "WorkSuitability100.dll SHA256: $sha" | Set-Content WorkSuitability100/Native/BUILD_INFO.txt
          Get-Item WorkSuitability100/Native/WorkSuitability100.dll | Select-Object FullName,Length
          git add WorkSuitability100/Native/WorkSuitability100.dll WorkSuitability100/Native/BUILD_INFO.txt WorkSuitability100/Native/WorkSuitability100_v1_7.cpp
          git diff --cached --stat

      - name: Commit rebuilt DLL and patched source
        shell: pwsh
        run: |
          if (git diff --cached --quiet) { exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build WorkSuitability100 v1.7 metadata candidate fix [skip ci]'
          git push origin HEAD:main
