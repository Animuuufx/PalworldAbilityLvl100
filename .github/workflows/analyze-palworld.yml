name: Analyze Palworld EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest release EXE
        shell: pwsh
        run: |
          $api = 'https://api.github.com/repos/Animuuufx/PalworldAbilityLvl100/releases/latest'
          $release = Invoke-RestMethod -Uri $api -Headers @{ 'User-Agent' = 'Aera-Palworld-Analyzer' }
          $asset = $release.assets | Where-Object { $_.name -eq 'Palworld-Win64-Shipping.exe' } | Select-Object -First 1
          if (-not $asset) { throw 'Palworld-Win64-Shipping.exe release asset not found.' }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile Palworld-Win64-Shipping.exe
          Get-FileHash Palworld-Win64-Shipping.exe -Algorithm SHA256
          (Get-Item Palworld-Win64-Shipping.exe).Length

      - name: Install Capstone
        shell: pwsh
        run: python -m pip install capstone

      - name: Analyze signatures and xrefs
        shell: pwsh
        run: python .github/tools/analyze_palworld.py Palworld-Win64-Shipping.exe > analysis.txt

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: palworld-signature-analysis
          path: analysis.txt
