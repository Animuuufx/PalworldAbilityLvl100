name: Analyze Palworld EXE

on:
  push:
    branches: [main]
    paths:
      - '.github/tools/analyze_palworld.py'
      - '.github/tools/analyze_native_lookup.py'
      - '.github/tools/analyze_speed_path.py'
      - '.github/workflows/analyze-palworld.yml'
      - 'PalworldEXE/Palworld-Win64-Shipping.exe'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Verify EXE
        shell: pwsh
        run: |
          if (-not (Test-Path PalworldEXE/Palworld-Win64-Shipping.exe)) { throw 'Palworld EXE not found.' }
          Get-Item PalworldEXE/Palworld-Win64-Shipping.exe | Select-Object FullName,Length
          Get-FileHash PalworldEXE/Palworld-Win64-Shipping.exe -Algorithm SHA256

      - name: Install Capstone
        shell: pwsh
        run: python -m pip install capstone

      - name: Analyze signatures and xrefs
        shell: pwsh
        run: |
          python .github/tools/analyze_palworld.py PalworldEXE/Palworld-Win64-Shipping.exe | Tee-Object analysis.txt
          python .github/tools/analyze_native_lookup.py PalworldEXE/Palworld-Win64-Shipping.exe | Tee-Object native_lookup.txt
          python .github/tools/analyze_speed_path.py PalworldEXE/Palworld-Win64-Shipping.exe | Tee-Object speed_analysis.txt
          Add-Content analysis.txt "`r`n"
          Get-Content native_lookup.txt | Add-Content analysis.txt

      - name: Save analysis to repository
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis.txt speed_analysis.txt
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Save latest Palworld speed analysis [skip ci]'
            git push
          } else {
            Write-Host 'Analysis unchanged; no commit needed.'
          }

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: palworld-signature-analysis
          path: |
            analysis.txt
            speed_analysis.txt
