name: Analyze Palworld EXE

on:
  push:
    branches: [main]
    paths:
      - '.github/tools/analyze_palworld.py'
      - '.github/workflows/analyze-palworld.yml'
      - 'PalworldEXE/Palworld-Win64-Shipping.exe'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Verify EXE
        shell: pwsh
        run: |
          if (-not (Test-Path PalworldEXE/Palworld-Win64-Shipping.exe)) { throw 'Palworld EXE not found.' }
          Get-Item PalworldEXE/Palworld-Win64-Shipping.exe | Select-Object FullName,Length
          Get-FileHash PalworldEXE/Palworld-Win64-Shipping.exe -Algorithm SHA256

      - name: Install Capstone
        shell: pwsh
        run: python -m pip install capstone

      - name: Analyze signatures and xrefs
        shell: pwsh
        run: python .github/tools/analyze_palworld.py PalworldEXE/Palworld-Win64-Shipping.exe | Tee-Object analysis.txt

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: palworld-signature-analysis
          path: analysis.txt
